{% if paginator.total_pages > 1 %}
<nav class="pagination" aria-label="Pages d'articles">
  {% if paginator.previous_page %}
  <a href="{{ paginator.previous_page_path | relative_url }}" rel="prev">← Plus récents</a>
  {% endif %}
  <span>{{ paginator.page }} / {{ paginator.total_pages }}</span>
  {% if paginator.next_page %}
  <a href="{{ paginator.next_page_path | relative_url }}" rel="next">Plus anciens →</a>
  {% endif %}
</nav>
{% endif %}
