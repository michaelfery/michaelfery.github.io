name: Nightly Build
on:
  schedule:
    # Every morning, so that posts dated in the future appear on their day
    - cron: '5 8 * * *'
  workflow_dispatch:

permissions:
  pages: write

jobs:
  request-build:
    runs-on: ubuntu-latest
    steps:
      - run: |
          gh api -X POST "repos/${{ github.repository }}/pages/builds" --jq '"build status: " + .status'
        env:
          GH_TOKEN: ${{ github.token }}
