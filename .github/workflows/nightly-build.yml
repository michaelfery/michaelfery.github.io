name: Nightly Build
on:
  schedule:
    # Just after midnight Paris time, so that posts dated 00:00 (Paris) appear on
    # their day. GitHub delays scheduled runs by several hours (5 to 10 observed),
    # so the cron must come after the post time: the delay then only pushes
    # publication into the morning, it can never make a post miss its day.
    # Minute 17 avoids the crowded top of the hour.
    - cron: '17 23 * * *'
  workflow_dispatch:

permissions:
  pages: write

jobs:
  request-build:
    runs-on: ubuntu-latest
    steps:
      - run: |
          gh api -X POST "repos/${{ github.repository }}/pages/builds" --jq '"build status: " + .status'
        env:
          GH_TOKEN: ${{ github.token }}
